databases:
  - name: bellastyle-postgres-db
    databaseName: bellastylemanager
    user: bellastyle_user
    plan: free

services:
  - type: web
    name: Proyecto-Aula-BellaStyle-Manager
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bellastyle-postgres-db
          property: connectionString
