<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | BellaStyle</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="flex min-h-screen flex-col bg-noche-950">

  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-b from-noche-950 via-noche-900/95 to-noche-950"></div>
    <div class="absolute -left-32 top-1/3 h-96 w-96 rounded-full bg-bella-700/15 blur-3xl"></div>
  </div>

  <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-5 py-5">
    <a href="welcome.html" class="font-titulo text-2xl font-bold text-bella-50">Bella<span class="text-bella-400">Style</span></a>
    <a href="index.html" class="rounded-lg border border-bella-300/25 bg-noche-900/70 px-3.5 py-1.5 text-sm font-medium text-bella-100 transition hover:border-bella-300/50 hover:text-white">Volver al login &rarr;</a>
  </header>

  <main class="flex flex-1 items-center justify-center px-5 pb-16">
    <section class="tarjeta-pastel animate-aparecer w-full max-w-md p-6 sm:p-8">
      <h1 class="text-3xl font-bold text-pastel-tinta">Recuperar contraseña</h1>
      <p class="mt-2 text-sm font-medium text-pastel-subtinta">Escribe tu usuario y define tu nueva contraseña.</p>

      <div id="alerta" data-tema="pastel" class="alerta mt-6"></div>

      <form id="formRecuperar" class="mt-6 space-y-5">
        <div>
          <label for="usuario" class="etiqueta-oscura">Usuario</label>
          <input id="usuario" class="campo-pastel" type="text" placeholder="Tu nombre de usuario" required>
        </div>
        <div>
          <label for="nueva" class="etiqueta-oscura">Nueva contraseña</label>
          <input id="nueva" class="campo-pastel" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div>
          <label for="confirmar" class="etiqueta-oscura">Confirmar contraseña</label>
          <input id="confirmar" class="campo-pastel" type="password" minlength="6" placeholder="Repite la contraseña" required>
        </div>
        <button type="submit" class="btn-primario w-full py-3 text-base shadow-md">Cambiar contraseña</button>
      </form>

      <p class="mt-6 border-t border-bella-300/50 pt-4 text-center text-sm font-semibold">
        <a href="index.html" class="text-bella-800 hover:text-bella-900 hover:underline">&larr; Volver a iniciar sesión</a>
      </p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alerta = document.getElementById('alerta');
      const nueva = document.getElementById('nueva').value;

      if (nueva !== document.getElementById('confirmar').value) {
        return mostrarAlerta(alerta, 'Las contraseñas no coinciden.');
      }

      const respuesta = await pedir('/recuperar-password', 'POST', {
        username: document.getElementById('usuario').value.trim(),
        nuevaPassword: nueva
      });

      if (respuesta.success) {
        mostrarAlerta(alerta, respuesta.message, 'ok');
        e.target.reset();
      } else {
        mostrarAlerta(alerta, respuesta.message);
      }
    });
  </script>
</body>
</html>
